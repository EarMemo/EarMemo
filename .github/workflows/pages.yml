# GitHub Pages (earmemo.github.io/EarMemo/) serves ONLY redirects to earmemo.app.
# The real site is deployed by Cloudflare Pages straight from this repo's root.
# Requires: repo Settings → Pages → Source = "GitHub Actions".
name: Deploy redirect shell to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build redirect stubs
        run: python3 .github/build-redirects.py . _redirects_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_redirects_site

      - id: deployment
        uses: actions/deploy-pages@v4
